<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="./font/stylesheet.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>Общие сведения</title>
</head>

<body>
    <div class="registration-form">
        <form id="registrationForm" novalidate>
            <h2>Общие сведения</h2>

            <div class="form-group">
                <input type="text" id="comandName" name="comandName" placeholder="Введите название команды...">
                <span id="comandNameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="text" id="schoolName" name="schoolName" placeholder="Введите название школы...">
                <span id="schoolNameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="text" id="cityName" name="cityName" placeholder="Введите город...">
                <span id="cityNameError" class="error-message"></span>
            </div>

            <button type="submit">Далее</button>
        </form>
    </div>

    <script src="./js/api.js"></script>
    <script>
        // Загрузка существующих данных при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const data = await apiGet('/general_information');
                if (data) {
                    document.getElementById('comandName').value = data.comandName || '';
                    document.getElementById('schoolName').value = data.schoolName || '';
                    document.getElementById('cityName').value = data.cityName || '';
                }
            } catch (error) {
                console.log('Нет существующих данных или ошибка загрузки');
            }
        });

        document.getElementById('registrationForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Отключаем стандартное поведение формы

            // Очистка предыдущих сообщений об ошибках
            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(error => error.textContent = '');

            let valid = true;

            // Универсальная функция валидации полей
            function validateField(id, errorId, validationFn) {
                const value = document.getElementById(id).value.trim();
                const errorMessage = validationFn(value);
                if (errorMessage) {
                    document.getElementById(errorId).textContent = errorMessage;
                    valid = false;
                }
            }

            // Функция валидации
            const isNotEmpty = value => (value.length === 0 ? 'Поле обязательно к заполнению' : '');

            // Проверка значений полей
            validateField('comandName', 'comandNameError', isNotEmpty);
            validateField('schoolName', 'schoolNameError', isNotEmpty);
            validateField('cityName', 'cityNameError', isNotEmpty);

            // Если все поля валидны, отправляем данные на API
            if (valid) {
                const formData = {
                    comandName: document.getElementById('comandName').value.trim(),
                    schoolName: document.getElementById('schoolName').value.trim(),
                    cityName: document.getElementById('cityName').value.trim()
                };

                // Отправка на Backend API
                apiPost('/general_information', formData)
                    .then(response => {
                        if (response.success) {
                            // Переход на следующую страницу
                            window.location.href = './mentor.html';
                        } else {
                            console.error('Ошибка в обработке формы', response);
                            alert('Ошибка сохранения данных');
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка сети', error);
                        alert('Ошибка соединения с сервером');
                    });
            }
        });
    </script>
</body>
</html>
