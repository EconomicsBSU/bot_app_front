<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=2">
    <style>
        /* Пять кнопок + крестик внизу: приподнимаем контент, чтобы кнопка не перекрывалась крестиком */
        .registration-form { padding-top: 110px; }
    </style>

    <title>Меню</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h2>Добро пожаловать на Олимпиаду по финансовой и цифровой грамотности!</h2>
        <a href="privacy_policy.html" id="reg-link">
            <button type="button">Регистрация</button>
        </a>
        <button type="button" id="team-info-button">Инфо о команде</button>
        <button type="button" id="faq-button">Помощь</button>
        <button type="button" id="support-button">Поддержка</button>
        <a href="admin.html" id="admin-link" style="display: none;">
            <button type="button">Админ-панель</button>
        </a>
        <a href="../index.html">
            <img src="../static/image/cross.png" class="bottom-icon-cross" alt="Закрыть">
        </a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        API.get("/api/reg/state")
            .then((data) => {
                if (data.is_admin) {
                    document.getElementById("admin-link").style.display = "";
                }
                if (data.unread_answers) {
                    document.getElementById("support-button").textContent =
                        "Поддержка (" + data.unread_answers + ")";
                }
                // При закрытом приёме заявок новые команды не заводим: показываем страницу с текстом о закрытии.
                if (!data.reg_open && !data.has_team) {
                    document.getElementById("reg-link").href = "registration_closed.html";
                }
            })
            .catch(() => {});

        document.getElementById("team-info-button").addEventListener("click", () => {
            window.location.href = "team_info.html";
        });

        document.getElementById("faq-button").addEventListener("click", () => {
            window.location.href = "help.html";
        });

        document.getElementById("support-button").addEventListener("click", () => {
            window.location.href = "support.html";
        });
    </script>
</body>

</html>
