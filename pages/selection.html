<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=3">
    <style>
        /* Меню не скроллится: и крестик, и кнопки всегда на своих местах. */
        html, body { height: 100%; overflow: hidden; }
        body { display: block; }
        .registration-form {
            height: 100vh; margin: 0 auto; justify-content: flex-end;
            padding: 0 22px 104px; /* снизу оставляем место под крестик (bottom: 60px + его высота) */
        }
        /* Логотип — часть базового фона: тот же размер и то же положение в углу, что на index.html.
           Смещение считаем от высоты экрана: на этой странице форма занимает всю высоту,
           тогда как в базе блок .registration-form центрируется по вертикали. */
        .corner-image { top: calc(50vh - 440px); right: -100px; width: 350px; }
        @media (min-width: 481px) {
            .corner-image { top: calc(50vh - 330px); right: -40px; width: 220px; }
        }
        /* Заголовок с кнопками прижат к низу: при нехватке места текст уходит вверх под логотип —
           логотип фоновый, поэтому текст и кнопки рисуем поверх него. */
        h2 { margin-bottom: 22px; }
        h2, .menu-buttons { position: relative; z-index: 1; }
        .menu-buttons {
            display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto;
        }
        .menu-buttons a { display: block; }
        .menu-buttons button { width: 100%; max-width: 320px; margin: 0 auto; padding: 10px 16px; font-size: 18px; }
    </style>

    <title>Меню</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h2>Добро пожаловать на Олимпиаду по финансовой и цифровой грамотности!</h2>
        <div class="menu-buttons">
            <a href="privacy_policy.html" id="reg-link">
                <button type="button">Регистрация</button>
            </a>
            <button type="button" id="team-info-button">Инфо о команде</button>
            <button type="button" id="faq-button">Помощь</button>
            <button type="button" id="support-button">Поддержка</button>
            <a href="admin.html" id="admin-link" style="display: none;">
                <button type="button">Админ-панель</button>
            </a>
        </div>
        <a href="../index.html">
            <img src="../static/image/cross.png" class="bottom-icon-cross" alt="Закрыть">
        </a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        API.get("/api/reg/state")
            .then((data) => {
                if (data.is_admin) {
                    document.getElementById("admin-link").style.display = "";
                }
                if (data.unread_answers) {
                    document.getElementById("support-button").textContent =
                        "Поддержка (" + data.unread_answers + ")";
                }
                // Участник, присоединившийся по ID команды, заявку не заполняет — регистрация только у капитана.
                if (data.member_role === "member") {
                    document.getElementById("reg-link").style.display = "none";
                } else if (!data.reg_open && !data.has_team) {
                    // При закрытом приёме заявок новые команды не заводим: показываем страницу с текстом о закрытии.
                    document.getElementById("reg-link").href = "registration_closed.html";
                }
            })
            .catch(() => {});

        document.getElementById("team-info-button").addEventListener("click", () => {
            window.location.href = "team_info.html";
        });

        document.getElementById("faq-button").addEventListener("click", () => {
            window.location.href = "help.html";
        });

        document.getElementById("support-button").addEventListener("click", () => {
            window.location.href = "support.html";
        });
    </script>
</body>

</html>
