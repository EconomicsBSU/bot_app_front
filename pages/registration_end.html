<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=3">

    <style>
        /* В styles.css body зафиксирован на 100vh с overflow:hidden, а у формы высота 600px с padding 230px —
           на маленьких экранах кнопки уходили за границу и не до скролла. */
        /* Скроллбар у WebView отнимает ~15px ширины, и логотип у правого края уезжает влево
           относительно страниц без прокрутки. Полосу не показываем (как в светлых страницах). */
        html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        body { display: block; }
        .registration-form {
            height: auto; min-height: 100vh; margin: 0 auto;
            padding: 24px 22px 40px;
        }
        /* Логотип — часть базового фона: тот же размер и то же положение в углу, что на index.html.
           Смещение считаем от высоты экрана: на этой странице форма занимает всю высоту,
           тогда как в базе блок .registration-form центрируется по вертикали. */
        .corner-image { top: calc(50vh - 440px); right: -100px; width: 350px; }
        @media (min-width: 481px) {
            .corner-image { top: calc(50vh - 330px); right: -40px; width: 220px; }
        }
        /* Заголовок начинаем сразу под логотипом — как в базе. */
        h2 { margin-top: calc(50vh - 94px); margin-bottom: 12px; }
        h6 { margin-bottom: 28px; font-size: 14px; line-height: 1.5; }
        button { width: 100%; max-width: 320px; margin: 0 auto 12px; padding: 10px 16px; font-size: 17px; }
    </style>

    <title>Конец регистрации</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h2>Вы успешно прошли регистрацию!</h2>
        <div>
            <h6 style="text-align: center;"> В разделе "Помощь" вы можете найти Памятку участника и Инструкцию по регистрации на портале.
                <br><br>❓ В случае возникновения вопросов напишите нам в разделе "Поддержка".
                <br><br>Желаем удачи!</h6>
        </div>
        <button type="button" onclick="window.location.href='team_info.html'">Моя команда</button>
        <button type="button" onclick="window.location.href='help.html'">Помощь</button>
        <button type="button" onclick="window.location.href='../index.html'">Спасибо!</button>
    </div>

    <script src="../static/js/api.js"></script>
</body>

</html>
