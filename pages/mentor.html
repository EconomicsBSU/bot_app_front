<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Ментор</title>
</head>

<body>
    <div class="registration-form">
        <form id="registrationForm" novalidate>
            <h2>Информация о менторе</h2>

            <div class="form-group">
                <input type="text" id="full_name" name="full_name" placeholder="Введите ФИО ментора...">
                <span id="full_nameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="text" id="post" name="post" placeholder="Введите должность ментора...">
                <span id="postError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Введите e-mail ментора...">
                <span id="emailError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="tel" id="phone" name="phone" placeholder="Введите телефон ментора...">
                <span id="phoneError" class="error-message"></span>
            </div>

            <button type="submit">Далее</button>
        </form>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        bindRegForm({
            formId: "registrationForm",
            endpoint: "/api/reg/mentor",
            next: "captain_info.html",
            fill: (team) => {
                const mentor = team.mentor || {};
                document.getElementById("full_name").value = mentor.full_name || "";
                document.getElementById("post").value = mentor.post || "";
                document.getElementById("email").value = mentor.email || "";
                document.getElementById("phone").value = mentor.phone_number || "";
            },
            fields: [
                { id: "full_name", fns: [Validators.notEmpty] },
                { id: "post", fns: [Validators.notEmpty] },
                { id: "email", fns: [Validators.email] },
                { id: "phone", fns: [Validators.phone] },
            ],
        });
    </script>
</body>

</html>
