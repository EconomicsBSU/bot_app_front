<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Общие сведения</title>
</head>

<body>
    <div class="registration-form">
        <form id="registrationForm" novalidate>
            <h2>Общие сведения</h2>

            <div class="form-group">
                <input type="text" id="team_name" name="team_name" placeholder="Введите название команды...">
                <span id="team_nameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="text" id="school" name="school" placeholder="Введите название школы...">
                <span id="schoolError" class="error-message"></span>
            </div>
            <div class="form-group">
                <input type="text" id="city" name="city" placeholder="Введите город...">
                <span id="cityError" class="error-message"></span>
            </div>

            <button type="submit">Далее</button>
        </form>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        bindRegForm({
            formId: "registrationForm",
            endpoint: "/api/reg/team",
            next: "mentor.html",
            fill: (team) => {
                document.getElementById("team_name").value = team.team_name || "";
                document.getElementById("school").value = team.school || "";
                document.getElementById("city").value = team.city || "";
            },
            fields: [
                { id: "team_name", fns: [Validators.notEmpty] },
                { id: "school", fns: [Validators.notEmpty] },
                { id: "city", fns: [Validators.notEmpty] },
            ],
        });
    </script>
</body>

</html>
