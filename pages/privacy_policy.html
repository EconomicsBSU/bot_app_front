<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="../static/js/tg-params.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=3">

    <title>Политика обработки персональных данных</title>

    <style>
        /* alert() в WebView Telegram не показывается, поэтому подсказка — текстом под кнопкой. */
        .agree-error {
            margin-top: 14px;
            color: #b3261e;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }

        /* Согласие привязывает к олимпиаде, поэтому её название видно прямо над кнопкой. */
        .track-line {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .track-switch {
            display: block;
            margin-top: 14px;
            font-size: 14px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h6>Для продолжения необходимо предоставить согласие на обработку ваших персональных данных в соответствии с
            <a href="https://bsu.by/upload/%D0%9F%D0%BE%D0%BB%D0%B8%D1%82%D0%B8%D0%BA%D0%B0_%D0%BE%D0%B1_%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B5_%D0%BF%D0%B5%D1%80%D1%81%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D1%85_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%852024.pdf"
            class="link" target="_blank">Политикой обработки персональных данных БГУ</a>
        </h6>
        <p id="track-line" class="track-line" hidden></p>
        <button type="button" id="agree-button">Соглашаюсь</button>
        <a href="track_choice.html" id="track-switch" class="track-switch link" hidden>Выбрать другую олимпиаду</a>
        <p id="agree-error" class="agree-error" hidden></p>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js?v=3"></script>
    <script>
        // Страница общая для обоих потоков: здесь согласие привязывает аккаунт к выбранной олимпиаде.
        let track = "school";

        // Регистрация закрыта администратором — дальше не пускаем.
        // Если регистрация уже начата — сразу переходим к заполнению.
        API.get("/api/reg/state")
            .then((data) => {
                if (!data.track) {
                    window.location.replace("track_choice.html");
                    return;
                }
                track = data.track;
                if (data.member_role === "member") {
                    // Присоединившийся по ID участник заявку не заполняет — ему доступен только просмотр.
                    window.location.replace("team_info.html");
                    return;
                }
                if (data.reg_open === false) {
                    window.location.replace("registration_closed.html");
                    return;
                }
                const picked = (data.tracks || []).find((item) => item.id === track);
                if (picked) {
                    const line = document.getElementById("track-line");
                    line.textContent = "Регистрация на: " + (picked.full_title || picked.title);
                    line.hidden = false;
                }
                // До создания заявки (это делает кнопка «Соглашаюсь») поток можно поменять.
                document.getElementById("track-switch").hidden = !!data.has_team;
                if (data.has_team) {
                    window.location.replace(nextPage());
                }
            })
            .catch(() => {});

        function nextPage() {
            return track === "student" ? "general_information_stud.html" : "general_information.html";
        }

        document.getElementById("agree-button").addEventListener("click", async () => {
            const button = document.getElementById("agree-button");
            const box = document.getElementById("agree-error");
            button.disabled = true;
            box.hidden = true;
            try {
                await API.post("/api/reg/start", { type: track });
                window.location.href = nextPage();
            } catch (error) {
                button.disabled = false;
                box.textContent = error.message;
                box.hidden = false;
            }
        });
    </script>
</body>

</html>
