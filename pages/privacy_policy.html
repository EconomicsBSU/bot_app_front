<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css">

    <title>Политика обработки персональных данных</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h6>Для продолжения необходимо предоставить согласие на обработку ваших персональных данных в соответствии с
            <a href="https://bsu.by/upload/%D0%9F%D0%BE%D0%BB%D0%B8%D1%82%D0%B8%D0%BA%D0%B0_%D0%BE%D0%B1_%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D0%BA%D0%B5_%D0%BF%D0%B5%D1%80%D1%81%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D1%85_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%852024.pdf"
            class="link" target="_blank">Политикой обработки персональных данных БГУ</a>
        </h6>
        <button type="button" id="agree-button">Соглашаюсь</button>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        // Если регистрация уже начата — сразу переходим к заполнению
        API.get("/api/reg/state")
            .then((data) => {
                if (data.has_team) {
                    window.location.replace("general_information.html");
                }
            })
            .catch(() => {});

        document.getElementById("agree-button").addEventListener("click", async () => {
            const button = document.getElementById("agree-button");
            button.disabled = true;
            try {
                await API.post("/api/reg/start", { type: "school" });
                window.location.href = "general_information.html";
            } catch (error) {
                button.disabled = false;
                alert(error.message);
            }
        });
    </script>
</body>

</html>
