<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .registration-form { padding: 30px 24px 20px; }
        .registration-form h2 { margin-bottom: 14px; font-size: 24px; }
        .section { margin-bottom: 22px; }
        .field {
            margin-bottom: 8px;
            padding: 9px 14px;
            background-color: #ffffff;
            border: 2px solid #9e9ba7;
            border-radius: 15px;
            color: #444444;
            font-size: 14px;
            line-height: 1.4;
            text-align: left;
        }
        .field-label { color: #9e9ba7; font-size: 12px; }
        .field-row { display: flex; justify-content: space-between; gap: 10px; }
        .field-row span:last-child { font-weight: 600; }
        .muted { color: #9e9ba7; font-size: 12px; }
        button { font-size: 18px; padding: 8px 28px; }
    </style>

    <title>Инфо о команде</title>
</head>

<body>
    <div class="registration-form check">
        <div id="content"><div class="field muted">Загрузка...</div></div>

        <button type="button" id="edit-button" style="display: none;">Изменить данные</button>
        <a href="help.html">
            <button type="button">Помощь</button>
        </a>
        <a href="selection.html">
            <button type="button">Назад</button>
        </a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        const content = document.getElementById("content");
        const editButton = document.getElementById("edit-button");

        function section(title, html) {
            return '<div class="section"><h2>' + escHtml(title) + "</h2>" + html + "</div>";
        }

        function field(label, value) {
            return '<div class="field"><div class="field-label">' + escHtml(label) + "</div>"
                + escHtml(value) + "</div>";
        }

        function row(label, value) {
            return '<div class="field field-row"><span>' + escHtml(label) + "</span><span>" + escHtml(value) + "</span></div>";
        }

        function person(label, member) {
            if (!member || !member.full_name) return "";
            const details = [member.post, member.grade ? "класс " + member.grade : ""].filter(Boolean).join(", ");
            const contacts = [member.phone_number, member.email].filter(Boolean).join(" · ");
            return '<div class="field"><div class="field-label">' + escHtml(label) + "</div>"
                + escHtml(member.full_name)
                + (details ? '<div class="muted">' + escHtml(details) + "</div>" : "")
                + (contacts ? '<div class="muted">' + escHtml(contacts) + "</div>" : "")
                + "</div>";
        }

        // Аккаунты, привязанные к команде по ID (кто они в составе — не определяем).
        function joinedSection(joined) {
            if (!joined || !joined.length) return "";
            return section("Присоединились к боту",
                joined.map((item) =>
                    '<div class="field"><div class="field-label">' + escHtml(item.full_name) + "</div>"
                    + (item.username ? "@" + escHtml(item.username) : "без username в Telegram")
                    + (item.joined_at ? '<div class="muted">' + escHtml(item.joined_at.slice(0, 10)) + "</div>" : "")
                    + "</div>").join(""));
        }

        function score(value) {
            return value === null || value === undefined ? "—" : String(value);
        }

        API.get("/api/reg/state")
            .then((data) => {
                const team = data.team;
                if (!team || !team.team_name) {
                    content.innerHTML = '<div class="field">Команда ещё не заполнена.</div>';
                    return;
                }
                const parts = team.participants || [];
                const s = team.scores || {};
                content.innerHTML =
                    section("Команда",
                        field("Название", team.team_name)
                        + row("ID команды", team.team_id)
                        + field("Город и школа", team.city + ", " + team.school)
                        + '<div class="muted">' + (team.finished ? "Заявка подана" : "Заявка ещё не подана")
                        + (team.reg_date ? " · " + team.reg_date : "") + "</div>"
                    )
                    + section("Состав",
                        person("Наставник", team.mentor)
                        + person("Капитан", team.captain)
                        + parts.map((member, index) => person("Участник " + (index + 1), member)).join("")
                    )
                    + joinedSection(team.joined)
                    + section("Баллы",
                        row("Тест (средний)", score(s.av_test_score))
                        + row("Эссе", score(s.essay_score))
                        + row("Итог", score(s.total_score))
                    );
                if (data.can_edit) {
                    editButton.style.display = "";
                } else {
                    content.insertAdjacentHTML(
                        "beforeend",
                        '<div class="muted">Изменять данные команды может только капитан.</div>'
                    );
                }
            })
            .catch((error) => {
                // Без причины на экране любая сетевая проблема выглядит как «нет данных».
                let message = "Не удалось загрузить данные";
                if (error.status === 401) {
                    // Участникам про контуры говорить не нужно: как обновить сессию — этого достаточно.
                    message += ": сессия мини-приложения не подтверждена. Закройте приложение и откройте его заново из чата бота.";
                } else if (error.message) {
                    message += ": " + error.message + " (" + (error.status || "нет связи с сервером") + ")";
                }
                content.innerHTML = '<div class="field">' + escHtml(message) + "</div>" +
                    '<button type="button" onclick="location.reload()">Повторить</button>';
            });

        editButton.addEventListener("click", () => {
            window.location.href = "final_check.html";
        });
    </script>
</body>

</html>
