<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Фото команды</title>
</head>

<body>
    <div class="registration-form">
        <form id="photoForm" novalidate>
            <h2>Фото команды</h2>

            <div class="upload" id="upload">
                <img src="../static/image/image 1.png" class="icon_photo" alt="Прикрепить">
                <p id="uploadText">Выберите фото вашей команды</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <div id="previewContainer" style="display: none; margin-top: 10px;">
                    <img id="imagePreview" src="" alt="Предпросмотр" style="max-width: 100px; max-height: 100px; display: block;">
                </div>
            </div>
            <div id="photoError" class="error-message" style="margin-bottom: 20px;"></div>

            <button type="submit" id="submit">Завершить регистрацию</button>
        </form>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        const upload = document.getElementById("upload");
        const fileInput = document.getElementById("fileInput");
        const uploadText = document.getElementById("uploadText");
        const previewContainer = document.getElementById("previewContainer");
        const imagePreview = document.getElementById("imagePreview");
        const photoError = document.getElementById("photoError");
        const submitButton = document.getElementById("submit");

        let hasExistingPhoto = false;
        let selectedFile = null;

        API.get("/api/reg/data")
            .then((data) => {
                const team = data.team || {};
                if (team.has_photo) {
                    hasExistingPhoto = true;
                    API.photoUrl("/api/reg/photo").then((url) => {
                        if (!url) return;
                        imagePreview.src = url;
                        previewContainer.style.display = "block";
                        uploadText.innerHTML = "Файл выбран: <b>" + escHtml(team.photo_filename) + "</b>";
                        upload.classList.add("active", "expanded");
                    });
                }
            })
            .catch((error) => {
                if (error.status === 409) {
                    window.location.replace("privacy_policy.html");
                }
            });

        upload.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;
            photoError.textContent = "";
            compressImageFile(file, (compressed) => {
                selectedFile = compressed;
                imagePreview.src = URL.createObjectURL(compressed);
                previewContainer.style.display = "block";
                upload.classList.add("active", "expanded");
                uploadText.innerHTML = "Файл выбран: <b>" + escHtml(compressed.name) + "</b>";
            });
        });

        document.getElementById("photoForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            photoError.textContent = "";
            if (!selectedFile && !hasExistingPhoto) {
                photoError.textContent = "Загрузите фото команды";
                return;
            }
            submitButton.disabled = true;
            try {
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append("file", selectedFile);
                    await API.upload("/api/reg/photo", formData);
                }
                window.location.href = "final_check.html";
            } catch (error) {
                submitButton.disabled = false;
                photoError.textContent = error.message;
            }
        });
    </script>
</body>

</html>
