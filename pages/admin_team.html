<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/admin.css">

    <title>Карточка команды</title>
</head>

<body class="admin-body">
    <div class="admin-page">
        <a class="back-link" href="admin_teams.html">&larr; К списку команд</a>
        <div id="content"><div class="empty-note">Загрузка...</div></div>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        const teamId = new URLSearchParams(window.location.search).get("id") || "";
        const content = document.getElementById("content");

        function row(label, value) {
            return '<div class="info-row"><span class="info-label">' + escHtml(label) +
                '</span><span class="info-value">' + escHtml(value) + "</span></div>";
        }

        function memberCard(title, member, extra) {
            if (!member) {
                return '<div class="card"><div class="section-title">' + escHtml(title) +
                    '</div><div class="empty-note">Нет данных</div></div>';
            }
            let rows = extra || "";
            rows += row("ФИО", member.full_name);
            if (member.post) rows += row("Должность", member.post);
            if (member.grade !== "") rows += row("Класс", member.grade);
            rows += row("E-mail", member.email) + row("Телефон", member.phone_number);
            return '<div class="card"><div class="section-title">' + escHtml(title) + "</div>" + rows + "</div>";
        }

        function scoreValue(value) {
            return value === null || value === undefined ? "" : String(value);
        }

        function renderTeam(team) {
            const badge = team.finished
                ? '<span class="badge done">Регистрация завершена</span>'
                : '<span class="badge progress">В процессе</span>';

            let html = '<div class="card"><div class="section-title">' + escHtml(team.team_name || "Без названия") + "</div>" +
                row("ID", team.team_id) +
                row("Город", team.city) +
                row("Школа", team.school) +
                row("Дата регистрации", team.reg_date || "—") +
                badge + "</div>";

            html += memberCard("Ментор", team.mentor);
            html += memberCard("Капитан", team.captain);

            const participants = team.participants || [];
            for (let i = 0; i < 3; i++) {
                html += memberCard("Участник " + (i + 1), participants[i] || null);
            }

            html += '<div class="card"><div class="section-title">Фото команды</div>' +
                (team.has_photo
                    ? '<img id="team-photo" src="" alt="Фото команды" style="max-width: 100%; border-radius: 10px;">'
                    : '<div class="empty-note">Фото не загружено</div>') +
                "</div>";

            html += '<div class="card"><div class="section-title">Оценки</div>' +
                '<form id="scoresForm" novalidate>' +
                '<div class="form-group"><input type="number" step="0.01" id="av_test_score" name="av_test_score" placeholder="Средний балл за тест..." value="' + escHtml(scoreValue(team.scores.av_test_score)) + '"></div>' +
                '<div class="form-group"><input type="number" step="0.01" id="essay_score" name="essay_score" placeholder="Балл за эссе..." value="' + escHtml(scoreValue(team.scores.essay_score)) + '"></div>' +
                row("Итоговый балл", scoreValue(team.scores.total_score) || "—") +
                '<span id="scoresError" class="error-message"></span>' +
                '<button type="submit">Сохранить оценки</button>' +
                "</form></div>";

            content.innerHTML = html;

            if (team.has_photo) {
                API.photoUrl("/api/admin/teams/" + teamId + "/photo").then((url) => {
                    const img = document.getElementById("team-photo");
                    if (img && url) img.src = url;
                });
            }

            document.getElementById("scoresForm").addEventListener("submit", async (event) => {
                event.preventDefault();
                const button = event.target.querySelector('button[type="submit"]');
                const errorEl = document.getElementById("scoresError");
                errorEl.textContent = "";
                button.disabled = true;
                try {
                    await API.post("/api/admin/teams/" + teamId + "/scores", {
                        av_test_score: document.getElementById("av_test_score").value,
                        essay_score: document.getElementById("essay_score").value,
                    });
                    window.location.reload();
                } catch (error) {
                    button.disabled = false;
                    errorEl.textContent = error.message;
                }
            });
        }

        API.get("/api/admin/teams/" + encodeURIComponent(teamId))
            .then((data) => renderTeam(data.team || {}))
            .catch((error) => {
                if (error.status === 403) {
                    window.location.replace("selection.html");
                    return;
                }
                content.innerHTML = '<div class="empty-note">' + escHtml(error.message) + "</div>";
            });
    </script>
</body>

</html>
