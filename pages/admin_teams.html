<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="../static/js/tg-params.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/admin.css">

    <title>Команды</title>
</head>

<body class="admin-body">
    <div class="admin-page">
        <a class="back-link" href="admin.html">&larr; Назад</a>
        <h2 class="admin-title">Команды</h2>

        <div class="filter-row">
            <button type="button" class="filter-button active" data-track="">Все потоки</button>
            <button type="button" class="filter-button" data-track="school">Школьники</button>
            <button type="button" class="filter-button" data-track="student">Студенты</button>
        </div>

        <input type="text" id="search" class="search-input" placeholder="Поиск: название, город, школа/вуз, ФИО, @username...">
        <div id="teams"></div>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js?v=3"></script>
    <script>
        const searchInput = document.getElementById("search");
        const teamsContainer = document.getElementById("teams");
        let searchTimer = null;
        let track = "";

        function renderTeams(items) {
            if (!items.length) {
                teamsContainer.innerHTML = '<div class="empty-note">Команды не найдены</div>';
                return;
            }
            teamsContainer.innerHTML = items.map((team) => {
                // У студентов вместо школы — вуз; в списке «все потоки» поток подписываем отдельно.
                const student = team.track === "student";
                const sub = [team.city, student ? team.univ : team.school].filter(Boolean).join(", ");
                const badge = team.finished
                    ? '<span class="badge done">Регистрация завершена</span>'
                    : '<span class="badge progress">В процессе</span>';
                return '<button type="button" class="team-card" data-id="' + escHtml(team.team_id) + '">' +
                    '<div class="team-name">' + escHtml(team.team_name) + "</div>" +
                    (sub ? '<div class="team-sub">' + escHtml(sub) + "</div>" : "") +
                    (track ? "" : '<div class="team-sub">' + (student ? "Олимпиада для студентов" : "Конкурс для школьников") + "</div>") +
                    (team.captain_name ? '<div class="team-sub">Капитан: ' + escHtml(team.captain_name) + "</div>" : "") +
                    '<div class="team-sub">Участников: ' + escHtml(team.members) +
                    (team.accounts ? " · в боте: " + escHtml(team.accounts) : "") + "</div>" +
                    badge + "</button>";
            }).join("");

            teamsContainer.querySelectorAll(".team-card").forEach((card) => {
                card.addEventListener("click", () => {
                    window.location.href = "admin_team.html?id=" + encodeURIComponent(card.dataset.id);
                });
            });
        }

        function loadTeams(query) {
            const params = new URLSearchParams();
            if (query) params.set("q", query);
            if (track) params.set("track", track);
            const path = "/api/admin/teams" + (params.toString() ? "?" + params.toString() : "");
            teamsContainer.innerHTML = '<div class="empty-note">Загрузка...</div>';
            API.get(path)
                .then((data) => renderTeams(data.teams || []))
                .catch((error) => {
                    if (error.status === 403) {
                        window.location.replace("selection.html");
                        return;
                    }
                    teamsContainer.innerHTML = '<div class="empty-note">' + escHtml(error.message) + "</div>";
                });
        }

        document.querySelectorAll(".filter-button").forEach((button) => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".filter-button").forEach((el) => el.classList.remove("active"));
                button.classList.add("active");
                track = button.dataset.track;
                loadTeams(searchInput.value.trim());
            });
        });

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadTeams(searchInput.value.trim()), 300);
        });

        loadTeams("");
    </script>
</body>

</html>
