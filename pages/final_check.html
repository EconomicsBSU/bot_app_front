<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">

    <title>Итоговая проверка</title>
</head>

<body>
    <div class="registration-form check">
        <form id="registrationForm" novalidate>

            <div style="margin-bottom: 30px">
                <h2>Общие сведения</h2>
                <div class="form-group">
                    <input type="text" id="team_name" name="team_name" placeholder="Введите название команды...">
                    <span id="team_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="school" name="school" placeholder="Введите название школы...">
                    <span id="schoolError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="city" name="city" placeholder="Введите город...">
                    <span id="cityError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Информация о менторе</h2>
                <div class="form-group">
                    <input type="text" id="mentor_name" name="mentor_name" placeholder="Введите ФИО ментора...">
                    <span id="mentor_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="mentor_post" name="mentor_post" placeholder="Введите должность ментора...">
                    <span id="mentor_postError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="mentor_email" name="mentor_email" placeholder="Введите e-mail ментора...">
                    <span id="mentor_emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="tel" id="mentor_phone" name="mentor_phone" placeholder="Введите телефон ментора...">
                    <span id="mentor_phoneError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Информация о капитане</h2>
                <div class="form-group">
                    <input type="text" id="captain_name" name="captain_name" placeholder="Введите ФИО капитана...">
                    <span id="captain_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="number" id="captain_grade" name="captain_grade" placeholder="Введите класс...">
                    <span id="captain_gradeError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="captain_email" name="captain_email" placeholder="Введите e-mail капитана...">
                    <span id="captain_emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="tel" id="captain_phone" name="captain_phone" placeholder="Введите телефон капитана...">
                    <span id="captain_phoneError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Информация об участнике 1</h2>
                <div class="form-group">
                    <input type="text" id="participant_1_name" name="participant_1_name" placeholder="Введите ФИО участника 1...">
                    <span id="participant_1_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="number" id="participant_1_grade" name="participant_1_grade" placeholder="Введите класс...">
                    <span id="participant_1_gradeError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="participant_1_email" name="participant_1_email" placeholder="Введите e-mail участника 1...">
                    <span id="participant_1_emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="tel" id="participant_1_phone" name="participant_1_phone" placeholder="Введите телефон участника 1...">
                    <span id="participant_1_phoneError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Информация об участнике 2</h2>
                <div class="form-group">
                    <input type="text" id="participant_2_name" name="participant_2_name" placeholder="Введите ФИО участника 2...">
                    <span id="participant_2_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="number" id="participant_2_grade" name="participant_2_grade" placeholder="Введите класс...">
                    <span id="participant_2_gradeError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="participant_2_email" name="participant_2_email" placeholder="Введите e-mail участника 2...">
                    <span id="participant_2_emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="tel" id="participant_2_phone" name="participant_2_phone" placeholder="Введите телефон участника 2...">
                    <span id="participant_2_phoneError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Информация об участнике 3</h2>
                <h6 style="text-align: left; color: #9e9ba7; margin-bottom: 10px;">Необязательный участник — оставьте поля пустыми, если его нет.</h6>
                <div class="form-group">
                    <input type="text" id="participant_3_name" name="participant_3_name" placeholder="Введите ФИО участника 3...">
                    <span id="participant_3_nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="number" id="participant_3_grade" name="participant_3_grade" placeholder="Введите класс...">
                    <span id="participant_3_gradeError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="participant_3_email" name="participant_3_email" placeholder="Введите e-mail участника 3...">
                    <span id="participant_3_emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <input type="tel" id="participant_3_phone" name="participant_3_phone" placeholder="Введите телефон участника 3...">
                    <span id="participant_3_phoneError" class="error-message"></span>
                </div>
            </div>

            <div style="margin-bottom: 30px">
                <h2>Фото команды</h2>

                <div class="upload" id="upload">
                    <img src="../static/image/image 1.png" class="icon_photo" alt="Прикрепить">
                    <p id="uploadText">Нажмите, чтобы заменить фото</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <div id="previewContainer" style="display: none; margin-top: 10px;">
                        <img id="imagePreview" src="" alt="Фото команды" style="max-width: 100px; max-height: 100px; display: block;">
                    </div>
                </div>
                <div id="photoError" class="error-message"></div>
            </div>

            <button type="submit" id="submit">Отправить</button>
        </form>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        const form = document.getElementById("registrationForm");
        const upload = document.getElementById("upload");
        const fileInput = document.getElementById("fileInput");
        const uploadText = document.getElementById("uploadText");
        const previewContainer = document.getElementById("previewContainer");
        const imagePreview = document.getElementById("imagePreview");
        const photoError = document.getElementById("photoError");
        const submitButton = document.getElementById("submit");

        let hasExistingPhoto = false;
        let selectedFile = null;

        API.get("/api/reg/data")
            .then((data) => {
                if (!requireEditable(data)) return;
                const team = data.team || {};
                fill(team);

                if (team.has_photo) {
                    hasExistingPhoto = true;
                    API.photoUrl("/api/reg/photo").then((url) => {
                        if (!url) return;
                        imagePreview.src = url;
                        previewContainer.style.display = "block";
                        upload.classList.add("active", "expanded");
                        uploadText.innerHTML = "Файл выбран: <b>" + escHtml(team.photo_filename) + "</b>";
                    });
                } else {
                    uploadText.textContent = "Выберите фото вашей команды";
                }
            })
            .catch((error) => {
                if (error.status === 409) {
                    window.location.replace("privacy_policy.html");
                }
            });

        function set(id, value) {
            document.getElementById(id).value = value === null || value === undefined ? "" : value;
        }

        function fill(team) {
            set("team_name", team.team_name);
            set("school", team.school);
            set("city", team.city);

            const mentor = team.mentor || {};
            set("mentor_name", mentor.full_name);
            set("mentor_post", mentor.post);
            set("mentor_email", mentor.email);
            set("mentor_phone", mentor.phone_number);

            const captain = team.captain || {};
            set("captain_name", captain.full_name);
            set("captain_grade", captain.grade);
            set("captain_email", captain.email);
            set("captain_phone", captain.phone_number);

            const participants = team.participants || [];
            for (let i = 1; i <= 3; i++) {
                const participant = participants[i - 1] || {};
                set("participant_" + i + "_name", participant.full_name);
                set("participant_" + i + "_grade", participant.grade);
                set("participant_" + i + "_email", participant.email);
                set("participant_" + i + "_phone", participant.phone_number);
            }
        }

        upload.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;
            photoError.textContent = "";
            compressImageFile(file, (compressed) => {
                selectedFile = compressed;
                imagePreview.src = URL.createObjectURL(compressed);
                previewContainer.style.display = "block";
                upload.classList.add("active", "expanded");
                uploadText.innerHTML = "Файл выбран: <b>" + escHtml(compressed.name) + "</b>";
            });
        });

        function participantFilled(i) {
            return ["name", "grade", "email", "phone"].some((field) => {
                return document.getElementById("participant_" + i + "_" + field).value.trim().length > 0;
            });
        }

        function validateAllFields() {
            const fields = [
                { id: "team_name", fns: [Validators.notEmpty] },
                { id: "school", fns: [Validators.notEmpty] },
                { id: "city", fns: [Validators.city] },
                { id: "mentor_name", fns: [Validators.notEmpty] },
                { id: "mentor_post", fns: [Validators.notEmpty] },
                { id: "mentor_email", fns: [Validators.email] },
                { id: "mentor_phone", fns: [Validators.phone] },
                { id: "captain_name", fns: [Validators.notEmpty] },
                { id: "captain_grade", fns: [Validators.grade] },
                { id: "captain_email", fns: [Validators.email] },
                { id: "captain_phone", fns: [Validators.phone] },
                { id: "participant_1_name", fns: [Validators.notEmpty] },
                { id: "participant_1_grade", fns: [Validators.grade] },
                { id: "participant_1_email", fns: [Validators.email] },
                { id: "participant_1_phone", fns: [Validators.phone] },
                { id: "participant_2_name", fns: [Validators.notEmpty] },
                { id: "participant_2_grade", fns: [Validators.grade] },
                { id: "participant_2_email", fns: [Validators.email] },
                { id: "participant_2_phone", fns: [Validators.phone] },
            ];
            if (participantFilled(3)) {
                fields.push(
                    { id: "participant_3_name", fns: [Validators.notEmpty] },
                    { id: "participant_3_grade", fns: [Validators.grade] },
                    { id: "participant_3_email", fns: [Validators.email] },
                    { id: "participant_3_phone", fns: [Validators.phone] },
                );
            }
            return validateFields(fields);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            photoError.textContent = "";
            if (!validateAllFields()) return;
            if (!selectedFile && !hasExistingPhoto) {
                photoError.textContent = "Загрузите фото команды";
                return;
            }

            const formData = new FormData(form);
            if (selectedFile) {
                formData.append("file", selectedFile);
            }

            submitButton.disabled = true;
            try {
                await API.upload("/api/reg/finish", formData);
                window.location.href = "registration_end.html";
            } catch (error) {
                submitButton.disabled = false;
                handleApiError(error);
            }
        });
    </script>
</body>

</html>
