<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="../static/js/tg-params.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=3">
    <style>
        /* Ссылка смены олимпиады — как на странице согласия: под кнопками, тем же шрифтом. */
        .track-switch {
            display: block;
            margin-top: 14px;
            font-size: 14px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
    </style>

    <title>Регистрация завершена</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h6 id="closed-text">Добрый день! Регистрация на XI конкурс «Финансовая и цифровая грамотность поколения Z» завершена.
            <br><br>В случае возникновения вопросов напишите нам в разделе «Поддержка».
        </h6>
        <a href="support.html">
            <button type="button">Поддержка</button>
        </a>
        <a href="selection.html">
            <button type="button">Назад</button>
        </a>
        <a href="track_choice.html" id="track-switch" class="track-switch link" hidden>Выбрать другую олимпиаду</a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js?v=3"></script>
    <script>
        // Текст о закрытии приёма у каждого потока свой (совпадает с ответом бэкенда).
        const tail = "<br><br>В случае возникновения вопросов напишите нам в разделе «Поддержка».";
        API.get("/api/reg/state").then((data) => {
            const texts = window.TRACK_TEXTS;
            document.getElementById("closed-text").innerHTML = (texts[data.track] || texts.school).closed + tail;
            // Приём закрыт у выбранной олимпиады, а другой может быть открыт: пока заявки нет,
            // человека не должно запереть на этом потоке.
            document.getElementById("track-switch").hidden = !!data.has_team;
        }).catch(() => { });
    </script>
</body>

</html>
