<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="../static/js/tg-params.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/styles.css?v=3">
    <style>
        /* Раскладка та же, что на selection.html: меню не скроллится, логотип на своём месте. */
        html, body { height: 100%; overflow: hidden; }
        body { display: block; }
        .registration-form {
            height: 100vh; margin: 0 auto; justify-content: flex-end;
            padding: 0 22px 60px;
        }
        .corner-image { top: calc(50vh - 440px); right: -100px; width: 350px; }
        @media (min-width: 481px) {
            .corner-image { top: calc(50vh - 330px); right: -40px; width: 220px; }
        }
        h2 { margin-bottom: 22px; }
        h2, .menu-buttons, .track-chosen { position: relative; z-index: 1; }
        .menu-buttons {
            display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto;
        }
        .menu-buttons button {
            width: 100%; max-width: 320px; margin: 0 auto; padding: 10px 16px;
            display: flex; flex-direction: column; gap: 3px; align-items: center;
        }
        /* Официальное название длинное: оно идёт второй строкой, мельче кнопки. */
        .btn-kind { font-size: 18px; }
        .btn-name { font-size: 13px; line-height: 1.3; font-weight: 400; opacity: .85; }
        /* alert() в WebView Telegram не показывается, поэтому подсказка — текстом под кнопками. */
        .track-error {
            margin-top: 14px; color: #b3261e; font-size: 14px; line-height: 1.4; text-align: center;
        }
        .track-chosen {
            margin-top: 14px; font-size: 14px; line-height: 1.4; text-align: center;
        }
    </style>

    <title>Главная</title>
</head>

<body>
    <div class="registration-form">
        <img src="../static/image/logo.png" class="corner-image">
        <h2>Добро пожаловать в школу финансовой и цифровой грамотности!</h2>
        <div class="menu-buttons">
            <button type="button" id="school-button">
                <span class="btn-kind">Конкурс</span>
                <span class="btn-name">«Финансовая и цифровая грамотность поколения Z», для школьников</span>
            </button>
            <button type="button" id="student-button">
                <span class="btn-kind">Олимпиада</span>
                <span class="btn-name">Евразийская студенческая олимпиада по аналитической экономике и прогнозированию</span>
            </button>
            <p id="track-chosen" class="track-chosen" hidden></p>
            <p id="track-error" class="track-error" hidden></p>
        </div>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js?v=3"></script>
    <script>
        // Выбор потока — ещё не привязка: она наступает на согласии обработки данных.
        // Сюда возвращаются и со страницы согласия, пока заявки нет.
        async function choose(track) {
            const box = document.getElementById("track-error");
            const buttons = [document.getElementById("school-button"), document.getElementById("student-button")];
            buttons.forEach((item) => { item.disabled = true; });
            box.hidden = true;
            try {
                await API.post("/api/track", { track: track });
                window.location.replace("../index.html");
            } catch (error) {
                buttons.forEach((item) => { item.disabled = false; });
                box.textContent = error.message;
                box.hidden = false;
            }
        }

        document.getElementById("school-button").addEventListener("click", () => choose("school"));
        document.getElementById("student-button").addEventListener("click", () => choose("student"));

        // Поток закреплён за заявкой — страница выбора больше не нужна.
        API.get("/api/reg/state")
            .then((data) => {
                if (data.has_team) {
                    window.location.replace("../index.html");
                    return;
                }
                if (!data.track) return;
                const picked = (data.tracks || []).find((item) => item.id === data.track);
                if (!picked) return;
                const hint = document.getElementById("track-chosen");
                hint.textContent = "Сейчас выбрано: " + (picked.full_title || picked.title)
                    + ". Меняйте, пока не нажали «Соглашаюсь».";
                hint.hidden = false;
            })
            .catch(() => {});
    </script>
</body>

</html>
