<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/admin.css">

    <title>Админ-панель</title>
</head>

<body class="admin-body">
    <div class="admin-page">
        <h2 class="admin-title">Админ-панель</h2>
        <a href="admin_stats.html">
            <button type="button">Статистика</button>
        </a>
        <a href="admin_teams.html">
            <button type="button">Команды</button>
        </a>
        <button type="button" id="export-button">Экспорт в Excel</button>
        <button type="button" id="reg-toggle" disabled>Приём заявок…</button>
        <a href="admin_support.html" id="support-link">
            <button type="button">Поддержка</button>
        </a>
        <a href="admin_admins.html" id="admins-link">
            <button type="button">Администраторы</button>
        </a>
        <a href="selection.html">
            <button type="button">Назад</button>
        </a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        const regToggle = document.getElementById("reg-toggle");
        let regOpen = null;

        function showRegFlag(value) {
            regOpen = value;
            regToggle.disabled = false;
            regToggle.textContent = value
                ? "Приём заявок: открыт — закрыть"
                : "Приём заявок: закрыт — открыть";
        }

        API.get("/api/reg/state")
            .then((data) => {
                if (!data.is_admin) {
                    window.location.replace("selection.html");
                    return;
                }
                showRegFlag(data.reg_open);
                // Список администраторов доступен только владельцу панели.
                if (!data.is_owner) {
                    document.getElementById("admins-link").style.display = "none";
                }
                const link = document.getElementById("support-link");
                link.querySelector("button").textContent = data.open_support
                    ? `Поддержка (${data.open_support})`
                    : "Поддержка";
            })
            .catch(() => {});

        regToggle.addEventListener("click", async () => {
            regToggle.disabled = true;
            try {
                const data = await API.post("/api/admin/reg", { open: !regOpen });
                showRegFlag(data.reg_open);
            } catch (error) {
                regToggle.disabled = false;
                handleApiError(error);
            }
        });

        document.getElementById("export-button").addEventListener("click", async () => {
            const button = document.getElementById("export-button");
            button.disabled = true;
            try {
                await API.download("/api/admin/export", "ФЦГ_команды.xlsx");
            } catch (error) {
                alert(error.message);
            }
            button.disabled = false;
        });
    </script>
</body>

</html>
