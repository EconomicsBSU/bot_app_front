<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="../static/js/tg-params.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="../static/font/stylesheet.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/admin.css">

    <title>Админ-панель</title>
</head>

<body class="admin-body">
    <div class="admin-page">
        <h2 class="admin-title">Админ-панель</h2>
        <a href="admin_stats.html">
            <button type="button">Статистика</button>
        </a>
        <a href="admin_teams.html">
            <button type="button">Команды</button>
        </a>
        <button type="button" id="export-button">Экспорт в Excel</button>
        <button type="button" id="photos-button">Фото команд архивом</button>
        <button type="button" id="reg-toggle-school" disabled>Приём заявок (школьники)…</button>
        <button type="button" id="reg-toggle-student" disabled>Приём заявок (студенты)…</button>
        <a href="admin_support.html" id="support-link">
            <button type="button">Поддержка</button>
        </a>
        <a href="admin_admins.html" id="admins-link">
            <button type="button">Администраторы</button>
        </a>
        <a href="selection.html">
            <button type="button">Назад</button>
        </a>
    </div>

    <script src="../static/js/config.js"></script>
    <script src="../static/js/api.js?v=3"></script>
    <script>
        // Приём заявок у каждого потока свой: переключатели не зависят друг от друга.
        const REG_TOGGLE = {
            school: { id: "reg-toggle-school", label: "школьники" },
            student: { id: "reg-toggle-student", label: "студенты" },
        };
        const regState = { school: null, student: null };

        function renderRegToggle(track) {
            const item = REG_TOGGLE[track];
            const button = document.getElementById(item.id);
            const open = regState[track];
            button.disabled = open === null;
            button.textContent = open === null
                ? "Приём заявок (" + item.label + ")…"
                : "Приём заявок (" + item.label + "): " + (open ? "открыт — закрыть" : "закрыт — открыть");
        }

        function showRegFlags(data) {
            regState.school = data.reg_open_school;
            regState.student = data.reg_open_student;
            Object.keys(REG_TOGGLE).forEach(renderRegToggle);
        }

        API.get("/api/reg/state")
            .then((data) => {
                if (!data.is_admin) {
                    window.location.replace("selection.html");
                    return;
                }
                showRegFlags(data);
                // Список администраторов доступен только владельцу панели.
                if (!data.is_owner) {
                    document.getElementById("admins-link").style.display = "none";
                }
                const link = document.getElementById("support-link");
                link.querySelector("button").textContent = data.open_support
                    ? `Поддержка (${data.open_support})`
                    : "Поддержка";
            })
            .catch(() => {});

        Object.keys(REG_TOGGLE).forEach((track) => {
            const button = document.getElementById(REG_TOGGLE[track].id);
            button.addEventListener("click", async () => {
                button.disabled = true;
                try {
                    showRegFlags(await API.post("/api/admin/reg", { track: track, open: !regState[track] }));
                } catch (error) {
                    handleApiError(error);
                }
                renderRegToggle(track);
            });
        });

        // Выгрузка общая: в файле потоки разложены по листам (Excel) и папкам (фото).
        document.getElementById("export-button").addEventListener("click", async () => {
            const button = document.getElementById("export-button");
            button.disabled = true;
            try {
                await API.download("excel");
            } catch (error) {
                alert(error.message);
            }
            button.disabled = false;
        });

        document.getElementById("photos-button").addEventListener("click", async () => {
            const button = document.getElementById("photos-button");
            button.disabled = true;
            button.textContent = "Готовим архив…";
            try {
                await API.download("photos");
            } catch (error) {
                alert(error.message);
            }
            button.textContent = "Фото команд архивом";
            button.disabled = false;
        });
    </script>
</body>

</html>
